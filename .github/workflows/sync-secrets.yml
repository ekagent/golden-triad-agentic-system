name: Sync Secrets

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/secrets-manifest.js'
      - '.github/workflows/sync-secrets.yml'
  workflow_dispatch:

jobs:
  sync:
    name: Sync to Vercel and Railway
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Sync Secrets
        run: node scripts/sync-secrets.mjs
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          
          # Manifest Keys
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          GLM_BASE_URL: ${{ secrets.GLM_BASE_URL }}
          GLM_FAST_MODEL: ${{ secrets.GLM_FAST_MODEL }}
          GLM_BALANCED_MODEL: ${{ secrets.GLM_BALANCED_MODEL }}
          GLM_POWER_MODEL: ${{ secrets.GLM_POWER_MODEL }}
          GLM_PRO_MODEL: ${{ secrets.GLM_PRO_MODEL }}
          
          MIMO_API_KEY: ${{ secrets.MIMO_API_KEY }}

          MIMO_BASE_URL: ${{ secrets.MIMO_BASE_URL }}
          MIMO_FAST_MODEL: ${{ secrets.MIMO_FAST_MODEL }}
          MIMO_PRO_MODEL: ${{ secrets.MIMO_PRO_MODEL }}
          
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_BASE_URL: ${{ secrets.OPENROUTER_BASE_URL }}
          OPENROUTER_SITE_URL: ${{ secrets.OPENROUTER_SITE_URL }}
          OPENROUTER_SITE_NAME: ${{ secrets.OPENROUTER_SITE_NAME }}
          OPENROUTER_FAST_MODEL: ${{ secrets.OPENROUTER_FAST_MODEL }}
          OPENROUTER_CODE_MODEL: ${{ secrets.OPENROUTER_CODE_MODEL }}
          OPENROUTER_REASONER_MODEL: ${{ secrets.OPENROUTER_REASONER_MODEL }}
          OPENROUTER_SAFE_MODEL: ${{ secrets.OPENROUTER_SAFE_MODEL }}
          
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          MINIMAX_BASE_URL: ${{ secrets.MINIMAX_BASE_URL }}
          MINIMAX_FAST_MODEL: ${{ secrets.MINIMAX_FAST_MODEL }}
          MINIMAX_POWER_MODEL: ${{ secrets.MINIMAX_POWER_MODEL }}
          
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_BASE_URL: ${{ secrets.GITHUB_BASE_URL }}
          GITHUB_CHAT_MODEL: ${{ secrets.GITHUB_CHAT_MODEL }}
          GITHUB_CODER_MODEL: ${{ secrets.GITHUB_CODER_MODEL }}
          
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL: ${{ secrets.DATABASE_SSL }}
          
          REDIS_URL: ${{ secrets.REDIS_URL }}
          CACHE_ENABLED: ${{ secrets.CACHE_ENABLED }}
          CACHE_TTL_SECONDS: ${{ secrets.CACHE_TTL_SECONDS }}
          AGENT_RUN_BUDGET_MS: ${{ secrets.AGENT_RUN_BUDGET_MS }}
          
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_CLERK_SIGN_IN_URL: ${{ secrets.NEXT_PUBLIC_CLERK_SIGN_IN_URL }}
          NEXT_PUBLIC_CLERK_SIGN_UP_URL: ${{ secrets.NEXT_PUBLIC_CLERK_SIGN_UP_URL }}
          
          NEXT_PUBLIC_PAYPAL_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_PAYPAL_CLIENT_ID }}
          PAYPAL_SECRET: ${{ secrets.PAYPAL_SECRET }}
          PAYPAL_API_BASE: ${{ secrets.PAYPAL_API_BASE }}
          
          COINBASE_COMMERCE_API_KEY: ${{ secrets.COINBASE_COMMERCE_API_KEY }}
          COINBASE_WEBHOOK_SECRET: ${{ secrets.COINBASE_WEBHOOK_SECRET }}
          
          GITHUB_PERSONAL_TOKEN: ${{ secrets.GITHUB_PERSONAL_TOKEN }}
          JIRA_HOST: ${{ secrets.JIRA_HOST }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_DEFAULT_PROJECT: ${{ secrets.JIRA_DEFAULT_PROJECT }}
          
          ADMIN_USER_IDS: ${{ secrets.ADMIN_USER_IDS }}
